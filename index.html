<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Семья</title>
<link rel="stylesheet" href="токены.css">
<style>
/* Раскладка дашборда; всё остальное — компоненты дизайн-системы (токены.css) */
body{padding-bottom:max(24px,env(safe-area-inset-bottom))}
.wrap{max-width:var(--content-wide);margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left));display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:900px){.wrap{grid-template-columns:2fr 1fr;align-items:start}.head{grid-column:1/-1}}
.focus{display:grid;gap:16px}
.card h2{font:600 16px/22px var(--font);display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 var(--sp-3)}
.stack{display:grid;gap:var(--sp-2)}
.row{display:flex;gap:var(--sp-3);align-items:center;flex-wrap:wrap;padding:var(--sp-3);background:var(--surface-1);border-radius:var(--r-xl)}
.row.past{opacity:.5}.row.now{outline:2px solid var(--positive)}
.row .time{font:600 16px/22px var(--font);min-width:52px;font-variant-numeric:tabular-nums}
.grow{flex:1;min-width:140px}
.acts{display:flex;gap:var(--sp-2);flex-wrap:wrap}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:var(--r-s)}
.card.urgent{box-shadow:inset 0 0 0 2px var(--negative)}
.day{margin:var(--sp-3) 0 var(--sp-2)}
.film{display:flex;gap:var(--sp-4)}
.film img{width:96px;height:144px;object-fit:cover;border-radius:var(--r-l);background:var(--surface-2);flex:none}
.mini{width:48px;height:72px;object-fit:cover;border-radius:var(--r-s);background:var(--surface-2);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin:var(--sp-1) 0 var(--sp-2)}
.chip-i input{position:absolute;opacity:0;pointer-events:none}
.chip-i span{display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:var(--r-pill);background:var(--surface-1);color:var(--text-primary);font:500 14px/18px var(--font);cursor:pointer;transition:background var(--t-base) var(--ease-std)}
.chip-i input:checked+span{background:var(--surface-dark);color:var(--on-surface-dark)}
.chip-i input:focus-visible+span{outline:2px solid var(--accent)}
.frow{display:flex;flex-wrap:wrap;gap:var(--sp-3);align-items:flex-end;margin-top:var(--sp-3)}
.frow label{display:grid;gap:var(--sp-1);font:400 14px/20px var(--font);color:var(--text-secondary)}
.frow .select{height:40px;min-width:180px}
.pickbox{background:var(--accent-soft)}
.pickbox b{font:600 20px/26px var(--font);display:block;margin:2px 0}
.why{background:var(--surface-1);border-left:3px solid var(--accent);padding:var(--sp-2) var(--sp-3);border-radius:0 var(--r-m) var(--r-m) 0;margin-top:var(--sp-2)}
.sections{grid-template-columns:repeat(2,1fr)}
@media(min-width:900px){.sections{grid-template-columns:1fr}}
.fin{grid-column:1/-1}.fin h2 small{font-weight:400;margin-left:var(--sp-2)}
.fin .fcols{display:grid;gap:var(--sp-5)}@media(min-width:900px){.fin .fcols{grid-template-columns:1fr 1fr}}
.fbar{display:grid;grid-template-columns:84px 1fr auto;gap:var(--sp-2);align-items:center;padding:3px 0;font:400 14px/20px var(--font)}.fbar.cat{grid-template-columns:minmax(110px,1.1fr) 2fr auto}
.fbar i{display:block;height:10px;border-radius:5px;background:var(--accent);min-width:2px}.fbar.part i{opacity:.45}.fbar em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--text-secondary);text-align:right}
.err{color:var(--text-negative)}
.gate{max-width:420px;margin:15vh auto;text-align:center;display:grid;gap:var(--sp-3);padding:0 var(--sp-4)}
[hidden]{display:none!important}
.toast{max-width:520px}
.toast .btn{background:transparent;color:inherit;border:1px solid currentColor;height:32px}
.row a,.card h2 a{color:inherit;text-decoration:none;border-bottom:1px solid var(--surface-3)}.row a:hover{border-bottom-color:var(--accent)}
</style>
</head>
<body>
<div id="gate" class="gate" hidden>
  <h1 class="t-h1">Введите код доступа</h1>
  <p class="t-text-s t-muted">Или откройте ссылку с кодом ещё раз.</p>
  <input id="gateCode" class="input" placeholder="Код" autocomplete="off">
  <button class="btn btn-primary btn-block" id="gateOk">Войти</button>
  <p class="err t-text-s" id="gateErr"></p>
</div>
<header class="app-header" id="appHeader" hidden><span class="app-title">Семья</span><span class="t-text-s t-muted" id="hSum"></span></header>
<div id="app" class="wrap" hidden>
  <div class="head"><h1 class="t-h1" id="hDate" style="margin:0"></h1></div>
  <main class="focus" id="focus"></main>
  <aside class="sections" id="plates"></aside>
  <section class="fin" id="fin"></section>
</div>
<div id="toast" class="toast" hidden></div>
<script src="логика.js"></script>
<script>
const SB_URL = "https://cuhplpukqhdfutcymtmv.supabase.co", SB_KEY = "sb_publishable_ILfqT6mCyHBOu6BVVRxHKQ_0bPQtNi3", KEY_LS = "dash_key";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const lsGet = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };
let KEY = lsGet(KEY_LS), RULES = null;
const S = { kids: null, health: null, film: null, fin: null, mode: lsGet("dash_mode") || "family", form: false, undo: false, view: null, bet: null, rec: null, recBusy: false, recErr: null, form2: null };
window.addEventListener("hashchange", () => { S.view = location.hash === "#film" ? "film" : null; render(); });

async function api(fn, action, payload) {
  const r = await fetch(`${SB_URL}/functions/v1/${fn}`, { method: "POST", headers: { "Content-Type": "application/json", apikey: SB_KEY, "x-mk-key": KEY }, body: JSON.stringify({ action, ...(payload || {}) }) });
  let j = {}; try { j = await r.json(); } catch {}
  if (r.status === 403 || j.code === "forbidden") throw Object.assign(new Error("forbidden"), { forbidden: true });
  if (j.status !== "ok") throw new Error(j.code || "error");
  return j;
}
function toast(text, onUndo) {
  const t = $("toast"); t.hidden = false;
  t.innerHTML = `<span>${esc(text)}</span>${onUndo ? '<button id="undo">Отменить</button>' : ""}`;
  S.undo = !!onUndo;
  if (onUndo) $("undo").onclick = async () => { t.hidden = true; S.undo = false; await onUndo(); load(); };
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; S.undo = false; render(); }, 10000);
}

// ── вход ──
async function boot() {
  const u = new URL(location.href), k = u.searchParams.get("k");
  if (k) { KEY = k; lsSet(KEY_LS, k); u.searchParams.delete("k"); history.replaceState(null, "", u.pathname + u.search + u.hash); }
  if (!KEY) return showGate();
  try { await api("dash", "ping"); }
  catch (e) { if (e.forbidden) { lsSet(KEY_LS, null); KEY = null; return showGate("Код не подошёл — откройте ссылку с кодом ещё раз."); }
    $("app").hidden = false; $("focus").innerHTML = `<div class="card">Нет связи · <button class="btn btn-secondary sm" onclick="location.reload()">Повторить</button></div>`; return; }
  RULES = await (await fetch("плашки.json")).json();
  $("gate").hidden = true; $("app").hidden = false; $("appHeader").hidden = false;
  fetch("icons.svg").then((r) => r.text()).then((t) => { const d = document.createElement("div"); d.style.display = "none"; d.innerHTML = t; document.body.prepend(d); }).catch(() => {});
  S.view = location.hash === "#film" ? "film" : null;
  renderPlates(); load();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
  setInterval(() => { if (!S.form && !S.undo) { load(); } }, 15 * 60000);
}
function showGate(msg) {
  $("gate").hidden = false; $("app").hidden = true; $("gateErr").textContent = msg || "";
  $("gateOk").onclick = () => { const v = $("gateCode").value.trim(); const m = v.match(/[?&]k=([^&\s]+)/); lsSet(KEY_LS, m ? m[1] : v); location.reload(); };
}

// ── данные ──
function today() { return new Date(Math.floor((Date.now() + 3 * 3600e3) / 86400e3) * 86400e3).toISOString().slice(0, 10); }
async function load() {
  const from = new Date(Date.now() - 3 * 3600e3).toISOString(), to = new Date(Date.now() + 50 * 3600e3).toISOString();
  S.kids = null; S.health = null; render();
  api("dash", "sched_list", { from, to }).then((j) => { S.kids = { events: j.events }; render(); }).catch(() => { S.kids = { error: true }; render(); });
  Promise.all([api("mk", "medbook"), api("mk", "task_state_list")]).then(([m, st]) => {
    const states = {}; (st.rows || []).forEach((r) => { states[r.person + "|" + r.task_key] = { s: r.status, until: r.until }; });
    S.health = { items: Dash.healthItems(m.data), states };
    render();
  }).catch(() => { S.health = { error: true }; render(); });
  api("dash", "finance").then((j) => { S.fin = j; render(); }).catch((e) => { S.fin = { error: e.message }; render(); });
  api("dash", "films_pick", { mode: S.mode }).then((j) => { S.film = j; S.bet = null; render(); }).catch(() => { S.film = { error: true }; render(); });
}

// ── отрисовка ──
function render() {
  if (S.view === "film" && !S.recBusy && document.activeElement && document.activeElement.closest && document.activeElement.closest("#recForm")) return;   // не сбрасываем форму под руками
  if (S.form && document.activeElement && document.activeElement.closest("form.add")) return;
  const now = new Date(), msk = Dash.msk(now);
  $("hDate").textContent = new Intl.DateTimeFormat("ru-RU", { weekday: "long", day: "numeric", month: "long", timeZone: "Europe/Moscow" }).format(now);
  const view = S.kids && S.kids.events ? Dash.scheduleView(now, S.kids.events) : null;
  const hc = S.health && S.health.items ? Dash.healthCard(today(), S.health.items, S.health.states) : null;
  const film = S.film && S.film.film;
  const order = Dash.focusOrder(now, { kids: { empty: !!view && !view.today.length && !view.tomorrow.length && !S.form },
    health: { urgent: !!hc && hc.urgent, empty: !!hc && !hc.rows.length }, film: { empty: !!S.film && !S.film.error && !film } });
  const parts = [];
  if (view) parts.push(`${view.today.length} ${plural(view.today.length, "занятие", "занятия", "занятий")} сегодня`);
  if (hc) parts.push(hc.total ? `${hc.total} ${plural(hc.total, "дело", "дела", "дел")} по здоровью` : "по здоровью спокойно");
  if (film) parts.push("фильм подобран");
  $("hSum").textContent = parts.join(" · ");
  if (S.view === "film") { $("focus").innerHTML = filmView(); $("plates").hidden = true; $("fin").hidden = true; bind(); return; }
  $("plates").hidden = false; $("fin").hidden = false; $("fin").innerHTML = finCard();
  const html = { kids: kidsCard(view), health: healthCardHtml(hc, order.urgent), film: filmCard() };
  $("focus").innerHTML = order.order.map((k) => order.collapsed.includes(k) && html[k].fold ? `<div class="card folded">${html[k].fold}</div>` : html[k].full).join("");
  bind();
}
const plural = (n, a, b, c) => { const m = n % 100, d = n % 10; return m > 10 && m < 15 ? c : d === 1 ? a : d > 1 && d < 5 ? b : c; };

function kidsCard(v) {
  if (!S.kids) return { full: `<div class="card"><h2>Дети</h2><span class="t-text-s t-muted">Загружаю…</span></div>`, fold: "" };
  if (S.kids.error) return { full: `<div class="card"><h2>Дети</h2>Календарь не отвечает · <button class="btn btn-secondary sm" data-act="reload">Повторить</button></div>` };
  const col = { dima: "var(--dima)", danya: "var(--danya)", family: "var(--family)" };
  const rows = (arr, empty) => arr.length ? arr.map((r) => `<div class="row ${r.status}">
      <span class="time">${esc(r.time)}</span><span class="tag ${r.child === "family" ? "tag--gray" : ""}" style="${r.child === "danya" ? "background:var(--accent-soft);color:var(--text-accent-2)" : ""}">${esc(r.childName)}</span>
      <div class="grow"><div class="t-bold">${esc(r.title)}</div><div class="t-text-s t-muted">${esc([r.until, r.place].filter(Boolean).join(" · "))}</div></div>
      ${r.id ? `<div class="acts"><button class="btn btn-secondary sm" data-act="move" data-id="${esc(r.id)}">Перенести</button><button class="btn btn-secondary sm" data-act="cancel" data-id="${esc(r.id)}">Отменить</button></div>` : ""}</div>`).join("") : `<div class="t-text-s t-muted">${empty}</div>`;
  const withIds = (arr) => arr.map((r) => Object.assign(r, { id: (S.kids.events.find((e) => e.start === r.start && e.title === r.title) || {}).id }));
  return { fold: `Дети: ${v.today.length + v.tomorrow.length ? "занятия есть" : "занятий нет"}`, full: `<div class="card"><h2>Дети — сегодня и завтра <button class="btn btn-secondary sm" data-act="add">+ Занятие</button></h2>
    <div class="day t-text-xs t-muted">Сегодня</div>${rows(withIds(v.today), "Сегодня без занятий")}
    <div class="day t-text-xs t-muted">Завтра</div>${rows(withIds(v.tomorrow), "Завтра без занятий")}
    ${S.form ? addForm() : ""}</div>` };
}
const rub = (n) => Math.round(n).toLocaleString("ru-RU").replace(/\u00a0/g, " ") + " ₽";
const MON = ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
function finCard() {
  const F = S.fin;
  if (!F) return `<div class="card"><h2>Финансы с начала года</h2><span class="t-text-s t-muted">Загружаю…</span></div>`;
  if (F.error) return `<div class="card"><h2>Финансы с начала года</h2>${F.error === "no_finance" ? "Сводка ещё не загружена" : "Финансы недоступны"} · <button class="btn btn-secondary sm" data-act="reload">Повторить</button></div>`;
  const d = (iso) => `${+iso.slice(8)} ${MON[+iso.slice(5, 7) - 1]}`;
  const mx = Math.max(...F.months.map((m) => m.life), 1), cmax = Math.max(...F.cats.map((c) => c.sum), 1);
  const last = F.as_of.slice(0, 7);
  const months = F.months.map((m) => `<div class="fbar ${m.m === last ? "part" : ""}"><span>${MON[+m.m.slice(5) - 1].replace("мая", "май")}${m.m === last ? " (до " + +F.as_of.slice(8) + ")" : ""}</span><i style="width:${m.life / mx * 100}%"></i><em>${rub(m.life)}</em></div>`).join("");
  const top = F.cats.slice(0, 12), rest = F.cats.slice(12).reduce((a, c) => a + c.sum, 0);
  const cats = top.concat(rest ? [{ name: "Остальное", sum: rest }] : []).map((c) => `<div class="fbar cat"><span>${esc(c.name)}</span><i style="width:${c.sum / cmax * 100}%"></i><em>${rub(c.sum)} · ${Math.round(c.sum / F.life * 100)}%</em></div>`).join("");
  return `<div class="card"><h2>Финансы с начала года <small class="t-text-s t-muted">${d(F.from)} – ${d(F.as_of)} ${F.as_of.slice(0, 4)}</small></h2>
    <div class="kpis"><div class="kpi"><div class="kpi__lab">расходы на жизнь</div><div class="kpi__val">${rub(F.life)}</div></div>
      <div class="kpi"><div class="kpi__lab">в среднем за месяц (${F.full_months} полных)</div><div class="kpi__val">${rub(F.avg_month)}</div></div>
      <div class="kpi"><div class="kpi__lab">отложено в инвестиции</div><div class="kpi__val">${rub(F.invest)}</div></div>
      <div class="kpi"><div class="kpi__lab">досрочно по ипотеке</div><div class="kpi__val">${rub(F.mortgage_prepay)}</div></div></div>
    <div class="fcols" style="margin-top:16px"><div><div class="day t-text-xs t-muted">По месяцам</div>${months}</div><div><div class="day t-text-xs t-muted">По категориям</div>${cats}</div></div>
    <div class="t-text-s t-muted" style="margin-top:10px">Без переводов между счетами, инвестиций и ипотеки. Рента за период: ${rub(F.rent)}. Обновлено ${esc(d(F.updated_at.slice(0, 10)))}.</div></div>`;
}
function addForm() {
  const d = new Date(Date.now() + 3 * 3600e3 + 86400e3).toISOString().slice(0, 10);
  return `<form class="add" id="addForm">
    <select class="select" name="child"><option value="dima">Дима</option><option value="danya">Даня</option><option value="family">Семья</option></select>
    <input class="input" name="title" placeholder="Название, например Шахматы" required>
    <input class="input" name="date" type="date" value="${d}" required><input class="input" name="time" type="time" value="17:00" required>
    <input class="input" name="minutes" type="number" min="5" max="600" value="60" aria-label="Длительность, минут">
    <select class="select" name="weekly"><option value="">Один раз</option><option value="1">Каждую неделю</option></select>
    <input class="input" name="place" placeholder="Место (необязательно)">
    <div class="err" id="addErr"></div>
    <div class="acts"><button class="btn btn-primary" type="submit">Записать в календарь</button><button type="button" class="btn btn-secondary" data-act="close">Отмена</button></div></form>`;
}
function healthCardHtml(c, urgent) {
  if (!S.health) return { full: `<div class="card"><h2>Здоровье</h2><span class="t-text-s t-muted">Загружаю…</span></div>`, fold: "" };
  if (S.health.error) return { full: `<div class="card"><h2>Здоровье</h2>Здоровье недоступно · <button class="btn btn-secondary sm" data-act="reload">Повторить</button></div>` };
  if (!c.rows.length) return { full: `<div class="card"><h2>Здоровье</h2><span class="t-text-s t-muted">Ближайших дел нет</span></div>`, fold: "Здоровье: ближайших дел нет" };
  const rows = c.rows.map((r, i) => `<div class="row"><div class="grow"><div class="t-bold">${esc(r.title)}</div><div style="margin-top:4px"><span class="tag">${esc(r.who)}</span> <span class="status ${r.days < 0 ? "status-bad" : r.days <= 3 ? "status-warn" : "status-ok"}">${esc(r.status)}</span></div></div>
    <div class="acts"><button class="btn btn-secondary sm" data-act="booked" data-i="${i}">Записан</button><button class="btn btn-secondary sm" data-act="done" data-i="${i}">Готово</button><button class="btn btn-secondary sm" data-act="snooze" data-i="${i}">Через неделю</button></div></div>`).join("");
  return { fold: "", full: `<div class="card ${urgent ? "urgent" : ""}"><h2>Здоровье ${urgent ? '<span class="status status-bad">Срочно</span>' : ""}</h2>${rows}<div class="acts" style="margin-top:8px"><a class="btn btn-secondary sm" href="${esc(medUrl())}">Открыть в медкнижке</a></div></div>` };
}
function medUrl() { const p = RULES.find((x) => x.withCode); return p.url + (KEY ? "?k=" + encodeURIComponent(KEY) : ""); }
const MODE_LABEL = { solo: "Я один", couple: "С Аней", family: "Всей семьёй", kids: "Только дети" };
const MOODS = [["лёгкое, чтобы не думать", "Лёгкое"], ["смешное", "Посмеяться"], ["фантастика с идеей", "Фантастика"], ["приключения", "Приключения"], ["напряжённый триллер", "Триллер"],
  ["криминал без российских ментов", "Криминал"], ["драма, чтобы подумать", "Драма"], ["страшное", "Ужасы"], ["мюзикл", "Мюзикл"], ["аниме", "Аниме"],
  ["советская классика", "Советское"], ["сериал", "Сериал"], ["короткое, до 90 минут", "Короткое"], ["удиви меня чем-то неожиданным", "Удиви"]];
function modeBar() { return `<div class="seg" style="flex-wrap:wrap">${Object.keys(MODE_LABEL).map((m) => `<button type="button" class="${S.mode === m ? "is-active" : ""}" data-act="mode" data-m="${m}">${MODE_LABEL[m]}</button>`).join("")}</div>`; }
function pickFilm(F) { if (!F || !F.new) return null; const list = F.new; if (S.bet != null && list[S.bet]) return { f: list[S.bet], reason: list[S.bet].why }; const p = F.pick && list.find((f) => f.title === F.pick.title && f.year === F.pick.year); return p ? { f: p, reason: F.pick.reason } : list[0] ? { f: list[0], reason: list[0].why } : null; }
function filmCard() {
  const FF = S.film;
  if (!FF) return { full: `<div class="card" id="film"><h2>Фильм на вечер</h2><span class="t-text-s t-muted">Подбираю по вашим оценкам… один раз в день, до минуты</span></div>`, fold: "" };
  if (FF.error) return { full: `<div class="card" id="film"><h2>Фильм на вечер</h2>Фильм не подобрался · <button class="btn btn-secondary sm" data-act="reload">Повторить</button>${modeBar()}</div>`, fold: "" };
  const pk = pickFilm(FF);
  if (!pk) return { full: `<div class="card" id="film"><h2>Фильм на вечер <button class="btn btn-secondary sm" data-act="film-all">Подбор →</button></h2>Подходящего не нашлось. <button class="btn btn-secondary sm" data-act="refresh">Подобрать заново</button>${modeBar()}</div>`, fold: "Фильм: вариантов нет" };
  const f = pk.f;
  return { fold: "", full: `<div class="card" id="film"><h2>Фильм на вечер <button class="btn btn-secondary sm" data-act="film-all">Весь подбор →</button></h2>${modeBar()}
    <div class="film" style="margin-top:10px">${f.poster ? `<img src="${esc(f.poster)}" alt="">` : `<img alt="">`}
      <div><h3>${esc(f.title)}</h3><div class="t-text-s t-muted">${filmMeta(f)}</div>
      <p>${esc(pk.reason || f.why || "")}</p>${f.description ? `<p class="t-text-s t-muted">${esc(f.description)}</p>` : ""}
      <div class="acts"><button class="btn btn-primary sm" data-act="watch">Смотрим</button>${FF.new.length > 1 ? '<button class="btn btn-secondary sm" data-act="next">Другой</button>' : ""}${f.wiki ? `<a class="btn btn-secondary sm" href="${esc(f.wiki)}" target="_blank" rel="noopener">Подробнее</a>` : ""}</div></div></div></div>` };
}
function filmCardFull(f, rewatch, blk, i) {
  const title = f.wiki ? `<a href="${esc(f.wiki)}" target="_blank" rel="noopener">${esc(f.title)}</a>` : esc(f.title);
  const orig = f.original_title && f.original_title !== f.title ? ` <span class="t-text-s t-muted">(${esc(f.original_title)})</span>` : "";
  const badge = rewatch && f.my_rating != null ? ` <span class="badge">моя ${esc(f.my_rating)}</span>` : "";
  return `<div class="row"><img class="mini" src="${esc(f.poster || "")}" alt="" loading="lazy">
    <div class="grow"><div><b>${title}</b>${orig}${badge}</div><div class="t-text-s t-muted">${filmMeta(f)}</div>
      ${f.description ? `<div class="t-text-s t-muted" style="margin-top:4px">${esc(f.description)}</div>` : ""}
      ${f.why ? `<div class="why"><b>Почему тебе:</b> ${esc(f.why)}</div>` : ""}</div>
    <div class="acts"><button class="btn btn-secondary sm" data-act="watch">Смотрим</button><button class="btn btn-secondary sm" data-act="seen" data-b="${blk}" data-i="${i}">Уже смотрел</button></div></div>`;
}
function filmSection(title, list, rewatch, blk, empty) {
  const idx = (f) => list.indexOf(f);
  const films = list.filter((f) => f.kind !== "animation"), anim = list.filter((f) => f.kind === "animation");
  let h = `<div class="card"><h2>${title}</h2>`;
  if (!list.length) return h + `<div class="t-text-s t-muted">${empty}</div></div>`;
  if (films.length) h += `<div class="day t-text-xs t-muted">Фильмы</div>${films.map((f) => filmCardFull(f, rewatch, blk, idx(f))).join("")}`;
  if (anim.length) h += `<div class="day t-text-xs t-muted">Мультфильмы</div>${anim.map((f) => filmCardFull(f, rewatch, blk, idx(f))).join("")}`;
  return h + "</div>";
}
function filmForm() {
  const F = S.form2 || { mode: S.mode, moods: [], wish: "", format: "any", count: "8", rewatch: true };
  return `<form class="card" id="recForm"><h2><button type="button" class="btn btn-secondary sm" data-act="film-back">← Назад</button><span>Что посмотрим сегодня?</span></h2>
    <div class="t-text-s t-muted">Подбор по моим оценкам: нейросеть знает весь список просмотренного и не предлагает виденное.</div>
    <div class="day t-text-xs t-muted">Кто смотрит</div><div class="chips">${Object.keys(MODE_LABEL).map((m) => `<label class="chip-i"><input type="radio" name="mode" value="${m}" ${F.mode === m ? "checked" : ""}><span>${MODE_LABEL[m]}</span></label>`).join("")}</div>
    <div class="day t-text-xs t-muted">Настроение и жанр — можно несколько</div><div class="chips">${MOODS.map(([v, l]) => `<label class="chip-i"><input type="checkbox" name="mood" value="${esc(v)}" ${F.moods.includes(v) ? "checked" : ""}><span>${l}</span></label>`).join("")}</div>
    <div class="day t-text-xs t-muted">Чего хочется — своими словами</div>
    <textarea class="textarea" name="wish" rows="3" placeholder="Например: что-то похожее на «Трассу 60», но посвежее. Или: вечер пятницы, устал, хочется доброго и смешного">${esc(F.wish)}</textarea>
    <div class="frow"><label>Формат<select class="select" name="format"><option value="any" ${F.format === "any" ? "selected" : ""}>Фильмы и мультфильмы</option><option value="films" ${F.format === "films" ? "selected" : ""}>Только фильмы и сериалы</option><option value="animation" ${F.format === "animation" ? "selected" : ""}>Только мультфильмы</option></select></label>
      <label>Сколько нового<select class="select" name="count">${["5", "8", "10"].map((n) => `<option ${F.count === n ? "selected" : ""}>${n}</option>`).join("")}</select></label>
      <label class="chk"><input type="checkbox" name="rewatch" ${F.rewatch ? "checked" : ""}> Добавить «ещё вспомним»</label></div>
    <div class="acts" style="margin-top:12px"><button class="btn btn-primary" type="submit" ${S.recBusy ? "disabled" : ""}>${S.recBusy ? "Подбираю…" : "Подобрать"}</button></div></form>`;
}
function filmResults(D) {
  if (S.recBusy) return `<div class="card"><span class="t-text-s t-muted">Нейросеть листает ваш список и подбирает… обычно 20–60 секунд.</span></div>`;
  if (S.recErr) return `<div class="card err">Не получилось: ${esc(S.recErr)}</div>`;
  if (!D) return `<div class="card"><span class="t-text-s t-muted">Подбираю ставку на сегодня…</span></div>`;
  let h = "";
  if (D.pick && D.pick.title) h += `<div class="card pickbox"><div class="t-text-s t-muted">Ставка на сегодня</div><b>${esc(D.pick.title)}</b><div>${esc(D.pick.reason)}</div></div>`;
  if (D.note) h += `<div class="card sub">${esc(D.note)}</div>`;
  h += filmSection("Не смотрел", D.new || [], false, "new", "Под такой запрос нового не нашлось — попробуйте ослабить условия.");
  if ((D.rewatch || []).length || (S.form2 ? S.form2.rewatch : true)) h += filmSection("Ещё вспомним", D.rewatch || [], true, "rewatch", "Из просмотренного с оценкой 7+ под запрос ничего не подошло.");
  const dropped = D.dropped && D.dropped.length ? ` Убрал как уже виденное: ${D.dropped.map(esc).join(", ")}.` : "";
  h += `<div class="t-text-s t-muted" style="padding:0 4px">Модель: ${esc(D.model || "")} · в списке просмотренного ${esc(D.watched_count || "")} позиций.${dropped}</div>`;
  return h;
}
function filmView() {
  const D = S.rec || S.film;
  return filmForm() + filmResults(D && !D.error ? D : null);
}
function renderPlates() {
  $("plates").innerHTML = RULES.map((p) => `<a class="section-tile ${p.url ? "" : "t-muted"}" href="${esc(p.withCode ? medUrl() : p.url || "#")}"><span class="section-tile__ic"><svg class="ic" aria-hidden="true"><use href="#i-${esc(p.ic || "star")}"/></svg></span><b>${esc(p.title)}</b><span class="t-text-s t-muted">${p.url ? esc(p.caption) : "Скоро"}</span></a>`).join("");
}

// ── действия ──
function bind() {
  const f = $("addForm");
  if (f) f.onsubmit = async (e) => {
    e.preventDefault(); const d = new FormData(f), err = $("addErr");
    const start = new Date(`${d.get("date")}T${d.get("time")}:00+03:00`);
    const clash = clashWith(d.get("child"), start, +d.get("minutes") || 60);
    if (clash && !f.dataset.force) { err.textContent = `Пересекается с «${clash.title}» ${clash.time}. Нажмите ещё раз, чтобы записать всё равно.`; f.dataset.force = "1"; return; }
    try {
      const j = await api("dash", "sched_add", { child: d.get("child"), title: d.get("title"), start: start.toISOString(), minutes: +d.get("minutes") || 60, weekly: !!d.get("weekly"), place: d.get("place") });
      S.form = false; toast("Записано в календарь", async () => { await api("dash", "sched_delete", { id: j.event.id }); }); load();
    } catch { err.textContent = "Не получилось записать в календарь"; }
  };
}
function clashWith(child, start, min) {
  if (!S.kids || !S.kids.events) return null;
  const s = +start, e = s + min * 60000;
  const hit = S.kids.events.find((x) => Dash.childOf(x) === child && x.start.includes("T") && +new Date(x.start) < e && +new Date(x.end) > s);
  return hit ? { title: hit.title, time: Dash.hhmm(Dash.msk(hit.start).min) } : null;
}
document.addEventListener("click", async (ev) => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id, ev1 = (S.kids && S.kids.events || []).find((e) => e.id === id);
  try {
    if (act === "reload") return load();
    if (act === "add") { S.form = true; return render(); }
    if (act === "close") { S.form = false; return render(); }
    if (act === "mode") { S.mode = b.dataset.m; lsSet("dash_mode", S.mode); S.film = null; S.bet = null; render(); try { S.film = await api("dash", "films_pick", { mode: S.mode }); } catch { S.film = { error: true }; } return render(); }
    if (act === "refresh") { S.film = null; S.bet = null; render(); try { S.film = await api("dash", "films_refresh", { mode: S.mode }); } catch { S.film = { error: true }; } return render(); }
    if (act === "next") { const n = S.film && S.film.new ? S.film.new.length : 0; S.bet = n ? ((S.bet == null ? 0 : S.bet) + 1) % n : null; return render(); }
    if (act === "film-all") { location.hash = "#film"; return; }
    if (act === "film-back") { history.replaceState(null, "", location.pathname + location.search); S.view = null; return render(); }
    if (act === "watch") return toast("Приятного просмотра!");
    if (act === "seen") {
      const D = S.rec || S.film, blk = b.dataset.b, f = D[blk][+b.dataset.i], r = prompt(`«${f.title}»: оценка от 1 до 10 (можно пропустить)`, "");
      const j = await api("dash", "films_seen", { title: f.title, year: f.year, type: f.genre, rating: r });
      D[blk].splice(+b.dataset.i, 1); S.bet = null; render();
      return toast(j.sheet === "added" ? "Записано в таблицу" : j.sheet === "exists" ? "Уже есть в таблице" : "Отмечено на дашборде; в таблицу пока не записалось");
    }
    if (act === "cancel") {
      const rec = !!ev1.recurringId, all = rec && confirm("Отменить всё расписание этого занятия? «Отмена» — только сегодняшнее.");
      await api("dash", "sched_cancel", { id, scope: all ? "all" : "one" });
      toast("Отменено", all ? null : async () => { await api("dash", "sched_restore", { id }); }); return load();
    }
    if (act === "move") {
      const t = prompt("Новое время, ЧЧ:ММ (в тот же день)", Dash.hhmm(Dash.msk(ev1.start).min)); if (!t || !/^\d{1,2}:\d{2}$/.test(t)) return;
      const day = new Date(+new Date(ev1.start) + 3 * 3600e3).toISOString().slice(0, 10);
      const all = !!ev1.recurringId && confirm("Перенести это и все следующие? «Отмена» — только это занятие.");
      const prev = ev1.start;
      await api("dash", "sched_move", { id, start: new Date(`${day}T${t.padStart(5, "0")}:00+03:00`).toISOString(), scope: all ? "all" : "one" });
      toast("Перенесено", async () => { await api("dash", "sched_move", { id, start: prev, scope: all ? "all" : "one" }); }); return load();
    }
    if (["booked", "done", "snooze"].includes(act)) {
      const c = Dash.healthCard(today(), S.health.items, S.health.states).rows[+b.dataset.i];
      if (act === "booked") await api("mk", "task_label_set", { person: c.person, key: c.title, label: "записан" });
      else if (act === "done") await api("mk", "task_state_set", { person: c.person, key: c.title, status: "done" });
      else { const u = new Date(Date.now() + 7 * 86400e3).toISOString().slice(0, 10); await api("mk", "task_state_set", { person: c.person, key: c.title, status: "snooze", until: u }); }
      S.health.states[c.person + "|" + Dash.taskKey(c.title)] = act === "snooze" ? { s: "snooze", until: new Date(Date.now() + 7 * 86400e3).toISOString().slice(0, 10) } : { s: "done" };
      toast(act === "booked" ? "Отмечено: записан" : act === "done" ? "Выполнено" : "Напомню через неделю", act === "booked" ? null : async () => { await api("mk", "task_state_set", { person: c.person, key: c.title, status: "clear" }); }); return render();
    }
  } catch { toast("Не получилось. Попробуйте ещё раз"); }
});
document.addEventListener("submit", async (ev) => {
  const f = ev.target.closest && ev.target.closest("#recForm"); if (!f) return;
  ev.preventDefault();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  const d = new FormData(f);
  S.form2 = { mode: d.get("mode") || "solo", moods: d.getAll("mood"), wish: String(d.get("wish") || "").trim(), format: d.get("format"), count: d.get("count"), rewatch: !!d.get("rewatch") };
  S.mode = S.form2.mode; lsSet("dash_mode", S.mode); S.recBusy = true; S.recErr = null; render();
  try { S.rec = await api("dash", "films_recommend", S.form2); } catch (e) { S.recErr = e.message === "error" ? "сервер не ответил, попробуйте ещё раз" : e.message; }
  S.recBusy = false; render();
});
boot();
</script>
</body>
