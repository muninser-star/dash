name: Repair stuck Pages deployment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-pages.yml']
permissions:
  pages: write
jobs:
  cancel-stale-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel the stale Pages deployment reported by GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/muninser-star/dash/pages/deployments/05ba3646b9251107c35f64bb86c8ffdbaafff2bd/cancel

